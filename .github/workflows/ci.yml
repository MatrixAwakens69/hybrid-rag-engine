name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-zero-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Run Phase 0 and Phase 1 regression gates
        run: uv run python scripts/validate_phase_1.py --keep-stack

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up Compose
        if: always()
        run: docker compose down
