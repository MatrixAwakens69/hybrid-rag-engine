name: hybrid-rag-engine

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    init: true
    environment:
      HRE_ENVIRONMENT: development
      HRE_APP_REVISION: docker-local
      HRE_QDRANT_URL: http://qdrant:6333
      HRE_SOURCE_VOLUME_PATH: /data/sources
      HRE_JOB_MANIFEST_PATH: /data/jobs
      HRE_QUARANTINE_PATH: /data/quarantine
    ports:
      - "8000:8000"
    volumes:
      - source-and-job-data:/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    init: true
    environment:
      HRE_ENVIRONMENT: development
      HRE_APP_REVISION: docker-local
      HRE_QDRANT_URL: http://qdrant:6333
      HRE_SOURCE_VOLUME_PATH: /data/sources
      HRE_JOB_MANIFEST_PATH: /data/jobs
      HRE_QUARANTINE_PATH: /data/quarantine
    volumes:
      - source-and-job-data:/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  qdrant-data:
  source-and-job-data:
